<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover включает отступы под вырез и полосу «Домой» на iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Личный дневник тренировок" />

    <!-- Режим приложения на iOS после «На экран „Домой“» -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Блокнот" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="styles.css" />
    <title>Тренировочный блокнот</title>
  </head>
  <body>
    <main id="app" class="main"></main>

    <nav class="nav" aria-label="Основная навигация">
      <a href="#/">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v2M12 19v2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M3 12h2M19 12h2M5.6 18.4 7 17M17 7l1.4-1.4M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z"/></svg>
        <span>Сегодня</span>
      </a>
      <a href="#/program">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 7v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7M4 7V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v1M8 2v4M16 2v4M8 12h2M14 12h2M8 16h2"/></svg>
        <span>Программа</span>
      </a>
      <a href="#/history">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2"/></svg>
        <span>История</span>
      </a>
      <a href="#/progress">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19h16M5 15l4-4 3 3 6-7M14 7h4v4"/></svg>
        <span>Прогресс</span>
      </a>
    </nav>

    <div id="timer-root"></div>
    <div id="sheet-root"></div>

    <noscript><p style="padding:24px">Для работы приложения нужен JavaScript.</p></noscript>

    <!-- Порядок важен: логика → хранилище → интерфейс → экраны → запуск -->
    <script src="js/domain.js"></script>
    <script src="js/seed.js"></script>
    <script src="js/program-old.js"></script>
    <script src="js/db.js"></script>
    <script src="js/platform.js"></script>
    <script src="js/anatomy.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/screens/today.js"></script>
    <script src="js/screens/workout.js"></script>
    <script src="js/screens/program.js"></script>
    <script src="js/screens/other.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
